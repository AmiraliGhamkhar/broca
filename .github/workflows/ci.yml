name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Production runs MySQL; the suite's concurrency paths (payment locks,
    # video progress, flashcard schedules) are only meaningful on MySQL —
    # SQLite silently ignores row locks.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: broca_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, intl, gd
          coverage: none

      - name: Install PHP dependencies
        run: |
          set -o pipefail
          composer install --prefer-dist --no-interaction --no-progress 2>&1 | tee /tmp/composer.log || {
            {
              echo "COMPOSER FAILED:"
              grep -iE "problem|conclusion|requires|does not|not satisfied|fatal|error|Warning|abandoned|memory" /tmp/composer.log | head -50
            } | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Point the test suite at MySQL
        run: |
          sed -i 's|<env name="DB_CONNECTION" value="sqlite"/>|<env name="DB_CONNECTION" value="mysql"/>|' phpunit.xml
          sed -i 's|<env name="DB_DATABASE" value=":memory:"/>|<env name="DB_DATABASE" value="broca_test"/>|' phpunit.xml

      # Audit gate (Round-6 audit I-1): composer.lock is the deploy artifact
      # on cPanel — a known-vulnerable lock must fail CI before it can be
      # committed, not after it ships. `composer audit` exits non-zero on any
      # advisory matching the locked packages.
      - name: Audit locked dependencies against security advisories
        run: composer audit --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Build frontend assets (LandingPageTest reads the Vite manifest)
        run: |
          npm ci --ignore-scripts
          npm run build

      # public/build is COMMITTED so that a Node-less cPanel deploy still
      # ships styled pages. That only holds if the committed artifacts match
      # the sources — otherwise production silently serves stale CSS.
      - name: Committed assets must match a fresh build
        run: |
          if ! git diff --quiet -- public/build; then
            echo "::error::public/build is stale. Run 'npm run build' and commit the result."
            git diff --stat -- public/build
            exit 1
          fi

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: broca_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run tests
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee /tmp/test-output.log || {
            # PHPUnit colours its output, and the failure detail (the asserted
            # expression, the file:line) arrives on lines that a grep over the
            # raw file cannot match. Strip the escapes first, then take context
            # around each FAILED marker - that is the text that decides whether
            # a red run is application code or a wrong expectation.
            tr -d '\033' < /tmp/test-output.log | sed -e 's/\[[0-9;]*m//g' > /tmp/test-output.txt
            {
              echo "FAILED TESTS SUMMARY:"
              grep -A 12 -E "^[0-9]+\) Tests" /tmp/test-output.txt | head -180
            } | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::${line}"
            done
            exit 1
          }
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: broca_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # The ::error:: annotations the test step emits are truncated and capped,
      # which hides exactly the assertion text that decides whether a red run is
      # application code or a wrong test expectation. This step always runs, so
      # the tail of the suite output renders on the PR's Checks tab and a failure
      # stays diagnosable without log access - which a sandboxed agent usually
      # cannot reach anyway.
      - name: Publish failure details to the job summary
        if: failure()
        run: |
          if [ ! -f /tmp/test-output.txt ]; then
            echo "no test output was produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Failed tests (suite output, escapes stripped)'
            echo ''
            echo '```text'
            if grep -qE "^[0-9]+\) Tests" /tmp/test-output.txt; then
              grep -B 2 -A 14 -E "^[0-9]+\) Tests" /tmp/test-output.txt | head -400
            else
              tail -300 /tmp/test-output.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-blocking style gate until the codebase has had one pint pass.
      - name: Code style (pint, non-blocking)
        run: vendor/bin/pint --test
        continue-on-error: true
