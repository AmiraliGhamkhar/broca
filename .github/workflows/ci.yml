name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # Production runs MySQL; the suite's concurrency paths (payment locks,
    # video progress, flashcard schedules) are only meaningful on MySQL —
    # SQLite silently ignores row locks.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: broca_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite, sqlite3, mbstring, intl, gd
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Point the test suite at MySQL
        run: |
          sed -i 's|<env name="DB_CONNECTION" value="sqlite"/>|<env name="DB_CONNECTION" value="mysql"/>|' phpunit.xml
          sed -i 's|<env name="DB_DATABASE" value=":memory:"/>|<env name="DB_DATABASE" value="broca_test"/>|' phpunit.xml

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
        env:
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Build frontend assets (LandingPageTest reads the Vite manifest)
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: broca_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: broca_test
          DB_USERNAME: root
          DB_PASSWORD: root

      # Non-blocking style gate until the codebase has had one pint pass.
      - name: Code style (pint, non-blocking)
        run: vendor/bin/pint --test
        continue-on-error: true
